# =============================================================================
# Security: JWT, rate-limiting, captcha, session base-auth, client-IP / proxy
# trust, auth token lifetimes, chat crypto, SuperAdmin bootstrap, cookies, CORS.
# Imported by application.yml.
# =============================================================================
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 2592000000   # 30 days
    guest-refresh-token-expiration-ms: 604800000  # 7 days
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY}
    refill-tokens: ${RATE_LIMIT_REFILL}
    refill-period-seconds: 1
  # Cloudflare Turnstile.
  captcha:
    enabled: ${CAPTCHA_ENABLED}
    secret-key: ${TURNSTILE_SECRET_KEY}

# Session base-auth credentials.
auth:
  username: ${AUTH_USERNAME}
  password: ${AUTH_PASSWORD}

app:
  security:
    # Reverse proxies in front of the app. X-Forwarded-For entries appended by these hops are
    # trusted; the client-supplied leading entries never are (see util.ClientIp). Prod = Nginx
    # Proxy Manager = 1. Set 0 if the app is reached directly, 2 with a CDN in front of NPM.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
    # Honour CF-Connecting-IP ONLY when Cloudflare proxies all traffic (else it is forgeable).
    trust-cloudflare-header: ${TRUST_CLOUDFLARE_HEADER:false}
    # Fail boot (enforce) / warn / off when a PUBLIC deployment (https origins) is missing the
    # 'prod' profile or exposes BootUI beyond localhost. Guards against shipping a dev .env to prod.
    production-hardening: ${PRODUCTION_HARDENING:warn}
    # HTTP rate limiting (RateLimitingFilter). Enforced only in prod-like profiles. Two buckets per
    # request: a GLOBAL per-user/per-IP backstop AND a PER-ENDPOINT bucket (same subject + normalized
    # "METHOD /route"), so a burst on one endpoint can't drain the whole quota.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      # PER-ENDPOINT (below) is the real limit: default 60 / user / endpoint / 60s (≈1 req/sec avg).
      # The GLOBAL caps are only a high anti-spray ceiling — sized ABOVE a very active genuine user's
      # measured aggregate (~600–800/min) so real users never hit them; they only catch a client
      # hammering MANY endpoints at once. Tune granularly with the per-endpoint overrides instead.
      auth-limit: ${RATE_LIMIT_AUTH:1200}           # global ceiling / user / window
      anon-limit: ${RATE_LIMIT_ANON:120}            # global ceiling / IP / window
      endpoint-default: ${RATE_LIMIT_ENDPOINT_DEFAULT:60}  # per-endpoint cap / subject / window
      # Per-endpoint overrides. Key = normalized "METHOD /route" (path ids masked to :id), in Spring
      # bracket-literal form so the exact method/case/slashes are preserved verbatim.
      endpoints:
        # ── RAISED: genuine active users legitimately exceed 60/min here (undebounced search,
        #    rapid chat-switching + history scroll, fast texting; all chats share one :id bucket). ──
        "[GET /api/v1/users/search]": 200
        "[GET /api/v1/discover]": 200
        "[GET /api/v1/chats/:id/messages]": 200
        "[GET /api/v1/chats/:id/messages/sync]": 150
        "[POST /api/v1/chats/:id/messages]": 150
        "[PUT /api/v1/chats/:id/read]": 150
        "[PUT /api/v1/chats/:id/delivered]": 150
        "[POST /api/v1/translate/batch]": 150
        # ── TIGHTENED: brute-force / spam vectors (well under 60). ──
        "[POST /api/v1/auth/login]": 10
        "[POST /api/v1/auth/signup]": 8
        "[POST /api/v1/auth/forgot-password]": 4
        "[POST /api/v1/auth/reset-password]": 8
        "[POST /api/v1/auth/change-password]": 8
        "[POST /api/v1/auth/resend-verification]": 4
        "[POST /api/v1/friends/requests]": 30
  cookie:
    secure: ${COOKIE_SECURE}
    same-site: ${COOKIE_SAME_SITE}
  cors:
    # Empty default so a dev/local run without the env var still boots (non-prod profiles
    # auto-allow http://localhost:* / http://127.0.0.1:* — see CorsConfig). Prod MUST set it.
    allowed-origins: ${ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-CSRF-Token,Accept,X-Request-Id
    exposed-headers: Set-Cookie,X-Request-Id,Retry-After
    allow-credentials: true
  auth:
    password-reset-token-ttl-minutes: ${PASSWORD_RESET_TTL_MIN}
    account-deletion-window-days: ${ACCOUNT_DELETION_WINDOW_DAYS}
    email-verification-token-ttl-minutes: ${EMAIL_VERIFY_TTL_MIN}
  # Per-conversation message encryption (AES-256-GCM). Stays OFF until master-key set.
  # ⚠️ Losing/rotating master-key makes all encrypted messages unrecoverable — back it up.
  # Base64 of 32 bytes. Generate: printf '%s' 'USER_KEYWORD_HERE' | openssl dgst -sha256 -binary | openssl base64 -A
  crypto:
    chat-encryption:
      enabled: ${CHAT_ENCRYPTION_ENABLED}
    master-key: ${CRYPTO_MASTER_KEY}
  # SuperAdmin bootstrap — comma-separated emails granted ROLE_SUPER_ADMIN on boot.
  super-admin:
    emails: ${SUPER_ADMIN_EMAILS}
