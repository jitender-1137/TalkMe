server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/talkme
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  #### Redis Configuration ####
  data:
    redis:
      host: ${REDIS_HOST:80.225.248.140}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:TalkMeRedis@2050!}
      timeout: 2000
      enabled: ${REDIS_ENABLED:true}
      ssl:
        enabled: ${REDIS_SSL:true}
  #### Multipart files ####
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

# CORS configurations
app:
  cors:
    allowed-origins: http://localhost:3000, http://10.221.83.139:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-CSRF-Token,Accept
    exposed-headers: Set-Cookie
    allow-credentials: true
  cookie:
    secure: true
    same-site: None

# Security JWT details
security:
  jwt:
    secret-key: c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5
    access-token-expiration-ms: 900000 # 15 minutes (15 * 60 * 1000)
    refresh-token-expiration-ms: 2592000000 # 30 days (30 * 24 * 60 * 60 * 1000)
    guest-refresh-token-expiration-ms: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)
  rate-limit:
    capacity: 100
    refill-tokens: 10
    refill-period-seconds: 1

# WebSocket Configuration
websocket:
  allowed-origins: '*'

# Storage Engine (Local)
storage:
  local:
    directory: ${FILE_BASE_DIR:/Users/jitenderyadav/Development/chat/backend/talkMe/uploads}

logging:
  level:
    root: INFO
    com.chat.talkMe: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
