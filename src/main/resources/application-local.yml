server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/talkme
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  #### Redis Configuration ####
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:talkMeRedis}
      timeout: 2000
      enabled: ${REDIS_ENABLED:false}
  #### Multipart files (image 2MB / video 30MB — enforced in UploadController) ####
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB

# CORS configurations
app:
  geo:
    # Dev only: geolocate the server's public IP when the client IP is local
    # (localhost), so country detection works during development.
    geolocate-local-ip: true
  cors:
    allowed-origins: http://localhost:3000, http://10.221.83.139:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-CSRF-Token,Accept
    exposed-headers: Set-Cookie
    allow-credentials: true
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  # RabbitMQ is OPT-IN via env (off by default in every profile, see base
  # application.yml). To use it locally with docker-compose RabbitMQ, run with:
  #   BROKER_RELAY_ENABLED=true BROKER_AMQP_EVENTS_ENABLED=true

# Security JWT details
security:
  jwt:
    secret-key: c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5
    access-token-expiration-ms: 900000 # 15 minutes (15 * 60 * 1000)
    refresh-token-expiration-ms: 2592000000 # 30 days (30 * 24 * 60 * 60 * 1000)
    guest-refresh-token-expiration-ms: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)
  rate-limit:
    capacity: 100
    refill-tokens: 10
    refill-period-seconds: 1

# WebSocket Configuration
websocket:
  allowed-origins: '*'

# Storage Engine (Local)
storage:
  local:
    directory: ${FILE_BASE_DIR:/Users/jitenderyadav/Development/chat/backend/talkMe/uploads}

logging:
  level:
    root: INFO
    com.chat.talkMe: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
