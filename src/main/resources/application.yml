# Behind the reverse proxy (Nginx Proxy Manager) TLS is terminated at the proxy and
# requests reach this backend over plain http (http://<host>:8080). Honour the
# X-Forwarded-Proto/Host headers the proxy sends so Spring builds correct absolute
# URLs — critically the OAuth2 redirect_uri as https://talkme.fun/login/oauth2/code/google
# (NOT http://…), which must byte-match the Authorised redirect URI in Google or the
# flow fails with redirect_uri_mismatch. Applies to every profile (prod runs on 8080).
# Safe locally: with no proxy there are no X-Forwarded-* headers, so the real request
# is used unchanged. Assumes the backend port is reachable only via the proxy.
server:
  forward-headers-strategy: framework

spring:
  # Load secrets/overrides from a local .env file (git-ignored). It's parsed as a
  # .properties source, so lines are KEY=VALUE — e.g. AI_API_KEY, BOT_GROQ_API_KEYS.
  # "optional:" means the app still starts if the file is absent (e.g. in prod, where
  # real env vars are injected instead). Values here satisfy the ${...} placeholders
  # below. NEVER commit .env — see .gitignore.
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  application:
    name: talkMe
  # Google social login (OAuth2 / OIDC). INACTIVE until GOOGLE_CLIENT_ID +
  # GOOGLE_CLIENT_SECRET are set — while blank Spring creates no client registration
  # and the app runs password/guest-only (SecurityConfig only wires oauth2Login when
  # a ClientRegistrationRepository exists). Register this authorized redirect URI in
  # the Google Cloud console:  <public-origin>/login/oauth2/code/google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # Default scopes give email, name and picture. To also read age/gender
            # append the People-API scopes (requires Google app verification in prod):
            #   ,https://www.googleapis.com/auth/user.birthday.read,https://www.googleapis.com/auth/user.gender.read
            scope: ${GOOGLE_OAUTH_SCOPES:openid,profile,email}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
  # Upload size cap — applies to EVERY profile (local/dev/prod) unless overridden.
  # This is the GLOBAL multipart limit, so it must be the LARGEST allowed media:
  # videos = 30MB. The stricter per-type image cap (2MB) is enforced in
  # UploadController; anything over 30MB is rejected with HTTP 413.
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB
  data:
    web:
      pageable:
        serialization-mode: via-dto
  # SMTP for transactional email (password reset). When MAIL_HOST is unset the
  # autoconfigured sender still exists but app.mail.enabled gates real sending —
  # see EmailServiceImpl, which logs the link instead of failing when disabled.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
        connecttimeout: 5000
        timeout: 5000
        writetimeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:talkme}
    password: ${RABBITMQ_PASS:talkme_dev_pass}
    # Treat a publish as accepted only after the broker confirms it (lets the
    # producer fall back to a direct broadcast if RabbitMQ is unreachable).
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        # Failed deliveries dead-letter instead of requeueing forever (no poison loop).
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 4
          multiplier: 2.0
          max-interval: 10000ms
  jpa:
    properties:
      hibernate:
        # Batch lazy association loads: when a page of messages is mapped to DTOs,
        # their senders/receipts/reactions/attachments are fetched in grouped IN
        # queries (≈ size per round-trip) instead of one query per row (N+1).
        default_batch_fetch_size: 50
        jdbc:
          # Group multi-row writes within a transaction into batched round-trips.
          batch_size: 30
          # Sort statements so same-table writes batch together instead of
          # alternating tables and breaking the batch.
          order_inserts: true
          order_updates: true
          # Required for batching to apply to @Version (optimistic-lock) entities,
          # which every entity is (BaseEntity has @Version).
          batch_versioned_data: true
        # Fail fast in dev if a query accidentally pages in memory.
        query:
          fail_on_pagination_over_collection_fetch: true

# Observability. Endpoints live under /actuator (outside /api, so reachable);
# RESTRICT /actuator to an internal network / scrape user in production.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    # Only health-check RabbitMQ when we actually use it; otherwise readiness
    # probes would keep failing to connect on hosts without RabbitMQ.
    rabbit:
      enabled: ${BROKER_AMQP_EVENTS_ENABLED:false}
  metrics:
    tags:
      application: talkMe
  tracing:
    # Sample 10% of traces by default; set TRACING_SAMPLING=0 to disable export
    # (e.g. dev with no OTLP collector running).
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  #### session base auth ####
auth:
  username: ${AUTH_USERNAME:admin}
  password: ${AUTH_PASSWORD:#Admin$321}

app:
  geo:
    # Default ON for local dev: when the client IP is local/private (localhost),
    # geolocate the server's own public IP so country detection still works.
    # Deployed profiles (prod/dev) override this to false — there real client IPs
    # arrive via proxy headers and a private IP would be a misconfiguration.
    geolocate-local-ip: ${GEOLOCATE_LOCAL_IP:true}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  broker:
    # OFF BY DEFAULT so the app runs on the in-memory STOMP broker with NO external
    # dependency. ONLY enable these where RabbitMQ (with the STOMP plugin on :61613)
    # is actually deployed and reachable — otherwise the relay throws "Message broker
    # not active" on every /topic broadcast and WS connections drop. Local dev turns
    # them on in application-local.yml (docker-compose RabbitMQ).
    #
    # relay-enabled: relay /topic + /user/queue through RabbitMQ for multi-instance
    # fan-out (RabbitDestinationInterceptor rewrites /topic/a/b/c -> /topic/a.b.c).
    relay-enabled: ${BROKER_RELAY_ENABLED:false}
    relay-host: ${BROKER_RELAY_HOST:localhost}
    relay-port: ${BROKER_RELAY_PORT:61613}
    relay-login: ${BROKER_RELAY_LOGIN:talkme}
    relay-passcode: ${BROKER_RELAY_PASSCODE:talkme_dev_pass}
    # amqp-events-enabled: route message fan-out through the AMQP work plane
    # (durable queue + retry + DLQ). When false, MessageServiceImpl broadcasts
    # directly in-request (and the RabbitMQ consumer/topology are not created).
    amqp-events-enabled: ${BROKER_AMQP_EVENTS_ENABLED:false}
  # Public base URL of the web app — used to build links in transactional emails
  # (e.g. the password-reset page). Override per environment.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    # Gate real SMTP sending. OFF by default so dev never fails on missing SMTP
    # creds — EmailServiceImpl logs the reset link instead. Turn ON in prod.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:TalkMe <noreply@talkme.app>}
  auth:
    # Password-reset token lifetime and the account-deletion recovery window.
    password-reset-token-ttl-minutes: ${PASSWORD_RESET_TTL_MIN:30}
    account-deletion-window-days: ${ACCOUNT_DELETION_WINDOW_DAYS:30}
  # Smart-reply suggestions via OpenAI-compatible chat APIs, with a primary →
  # fallback chain. Primary = Groq (free, fast); fallback = Hugging Face router,
  # tried automatically only if Groq errors / rate-limits / times out / returns
  # nothing. OFF until a primary key is set; if both fail the client uses its
  # local rule-based suggestions. Any OpenAI-compatible provider works by config.
  #
  # PRIVACY: the recent conversation is sent to these external providers (it
  # leaves your network). Keep the Privacy/Terms copy in sync and review each
  # provider's data-retention policy before enabling in production.
  ai:
    enabled: ${AI_SUGGESTIONS_ENABLED:true}
    # Fewer context messages + fewer chips = fewer tokens = faster/cheaper.
    context-messages: ${AI_CONTEXT_MESSAGES:10}
    suggestions: ${AI_SUGGESTIONS_COUNT:3}
    timeout-ms: ${AI_TIMEOUT_MS:8000}
    # PRIMARY — Groq. Free key at https://console.groq.com (no card). NEVER commit it.
    # llama-3.1-8b-instant: 14,400 req/day + 500K tokens/day free, fast, good Hinglish.
    primary:
      base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${AI_API_KEY:}
      model: ${AI_MODEL:llama-3.1-8b-instant}
    # FALLBACK — Hugging Face router (OpenAI-compatible). Token from
    # https://huggingface.co/settings/tokens. Small free credit (~$0.10/mo) then
    # pay-as-you-go — used only when Groq is unavailable. Leave api-key blank to disable.
    fallback:
      base-url: ${AI_FALLBACK_BASE_URL:https://router.huggingface.co/v1}
      api-key: ${AI_FALLBACK_API_KEY:}
      # Ungated model (no license approval). meta-llama/* is gated → 403 unless approved.
      model: ${AI_FALLBACK_MODEL:Qwen/Qwen2.5-7B-Instruct}

  # Conversational AI bots (Sonal / Ruchi / Annu). They appear as normal users;
  # when a HUMAN messages one of them in a 1:1 chat, the server auto-replies via an
  # OpenAI-compatible LLM. A PROVIDER FALLBACK CHAIN is tried in order until one
  # answers (advances on rate-limit / error / empty):
  #   Groq keys #1..#N (llama-3.1-8b-instant) → Hugging Face keys #1..#N (Qwen2.5-7B) → self-hosted Ollama.
  # This is separate from smart-reply's app.ai.* config — they don't share keys.
  #
  # Bots never reply to other bots (server guard: only human-sent messages trigger
  # a reply), so they cannot talk to each other.
  bot:
    enabled: ${BOT_ENABLED:false}
    # Cap per reply.
    max-output-tokens: ${BOT_MAX_OUTPUT_TOKENS:220}
    # (1) PRIMARY — Groq. Comma-separated keys (4 free accounts), each its own free bucket;
    # tried in order, next on rate-limit. Free keys: https://console.groq.com/keys
    groq:
      base-url: ${BOT_GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${BOT_GROQ_MODEL:llama-3.1-8b-instant}
      api-keys: ${BOT_GROQ_API_KEYS:}
    # (2) FALLBACK — Hugging Face router (Qwen2.5-7B). Comma-separated tokens (4 accounts),
    # each fine-grained with "Make calls to Inference Providers". Blank = skip this step.
    hf:
      base-url: ${BOT_HF_BASE_URL:https://router.huggingface.co/v1}
      model: ${BOT_HF_MODEL:Qwen/Qwen2.5-7B-Instruct}
      api-keys: ${BOT_HF_API_KEYS:}
    # (3) LAST RESORT — self-hosted Ollama (unlimited, private, slower). Blank base-url = skip.
    ollama:
      base-url: ${BOT_OLLAMA_BASE_URL:https://ollama.parkarspot.com/v1}
      model: ${BOT_OLLAMA_MODEL:qwen2.5:7b}
      api-key: ${BOT_OLLAMA_API_KEY:}
    # Which bots circulate where (all 12 stay online/searchable for DMs regardless).
    # Lobby shows these 7; quick-match randomly pairs from these 8.
    lobby-usernames: ${BOT_LOBBY_USERNAMES:sonal,ruchi,annu,seema,parvathy,fatima,arti,aryan,rohan,karan,nikhil,aditya,rahul,arjun,sameer,vikram,manish}
    match-usernames: ${BOT_MATCH_USERNAMES:sia,neetu,ekta,anjali,asiya,sonal,annu,parvathy,aryan,rohan,karan,nikhil,aditya,rahul,arjun,sameer,vikram,manish}
    match:
      # A waiting user with no human peer is paired with a bot after this delay.
      min-wait-ms: ${BOT_MATCH_MIN_WAIT_MS:2000}
      max-wait-ms: ${BOT_MATCH_MAX_WAIT_MS:5000}
    # How many recent messages of the conversation are sent as context each turn.
    context-messages: ${BOT_CONTEXT_MESSAGES:12}
    # Generous — self-hosted CPU inference is slow; bots reply async so a long wait
    # is fine (and looks human). Lower it on a GPU.
    timeout-ms: ${BOT_TIMEOUT_MS:45000}
    # Human-feel: show "typing…" then wait a randomised delay before the reply
    # lands, scaled a little by reply length (bounded by these two values, in ms).
    # Reply delay: a real person doesn't answer instantly. Random pause in this range
    # (default 3-20s) before each bot reply lands, shown behind a "typing…" indicator.
    min-delay-ms: ${BOT_MIN_DELAY_MS:3000}
    max-delay-ms: ${BOT_MAX_DELAY_MS:20000}
    # Lobby presence realism: each lobby bot has a small chance per heartbeat to leave
    # the lobby for a random 10-20 min, then return (feels like a user coming and going).
    lobby-away-chance: ${BOT_LOBBY_AWAY_CHANCE:0.04}
    lobby-away-min-ms: ${BOT_LOBBY_AWAY_MIN_MS:600000}
    lobby-away-max-ms: ${BOT_LOBBY_AWAY_MAX_MS:1200000}
    # Discover presence realism: keep a rotating 3-7 bots OFFLINE, each for a random
    # 30-60 min, then back online (so Discover shows some bots offline like real users).
    offline-min: ${BOT_OFFLINE_MIN:3}
    offline-max: ${BOT_OFFLINE_MAX:7}
    offline-min-ms: ${BOT_OFFLINE_MIN_MS:1800000}
    offline-max-ms: ${BOT_OFFLINE_MAX_MS:3600000}

# Cloudflare Turnstile CAPTCHA. Dev default is Cloudflare's "always passes"
# TEST secret — set the real TURNSTILE_SECRET_KEY via env in production.
security:
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
    secret-key: ${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}

# Web Push (VAPID). Override the keys via env in production.
# Generate a new pair with: openssl / web-push generate-vapid-keys
webpush:
  enabled: ${WEBPUSH_ENABLED:true}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:BKCeDr6ImE2uISF6APs0OyMfgoWkXWo-TNpXY1hdnrJyj1CtbH5Joo0tuqRrmXX-Zd1an5Bh7Y4cOQe6hv3yqzQ}
    private-key: ${VAPID_PRIVATE_KEY:pMHBoMj1sI4zsmg2TIg0g870XZbUPElqR-nkOY-FfnQ}
    subject: ${VAPID_SUBJECT:mailto:admin@talkme.app}

# Content moderation (free, self-hosted). Text uses bundled multilingual word-lists;
# images/video are screened by the free nsfwjs sidecar (see docker-compose `nsfw`).
moderation:
  enabled: ${MODERATION_ENABLED:true}
  nsfw:
    enabled: ${NSFW_ENABLED:true}
    base-url: ${NSFW_BASE_URL:http://localhost:8081}

NSFW_BASE_URL: http://nsfw.parkarspot.com
# Smart-reply / Groq key is provided via the AI_API_KEY environment variable
# (see app.ai.api-key above). NEVER commit a real key here — a committed key is
# exposed in git history and must be rotated in the Groq console.