version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talkme-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: talkMe_prod
      POSTGRES_USER: talkMe_prod
      POSTGRES_PASSWORD: TalkMe$9211!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talkMe"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talkme-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
