app:
  cors:
    allowed-origins: '*'
    # FIXED: Using allowed-origin-patterns to prevent a runtime crash with allow-credentials: true
    allowed-origin-patterns: '*'
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-CSRF-Token,Accept
    exposed-headers: Set-Cookie
    allow-credentials: true

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 2592000000 # 30 days
    guest-refresh-token-expiration-ms: 604800000 # 7 days
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_REFILL:10}
    refill-period-seconds: 1

storage:
  local:
    directory: /opt/media/talkme
  s3:
    enabled: true
    bucket-name: ${S3_BUCKET}
    region: ${S3_REGION}
    endpoint: ${S3_ENDPOINT}

websocket:
  allowed-origins: '*'
  # FIXED: Using allowed-origin-patterns here as well
  allowed-origin-patterns: '*'

logging:
  level:
    root: WARN
    com.chat.talkMe: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"