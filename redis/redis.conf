# ============================================================================
#  TalkMe Redis — hardened standalone config
#  Goal: a plain app cache that can NEVER be turned into a replica or used to
#  load a module / write files, even if the network + password layers fail.
# ============================================================================

# --- Network -----------------------------------------------------------------
# Exposure is controlled by docker-compose (port published on 127.0.0.1 only,
# never 0.0.0.0). protected-mode stays on as a backstop: with it on, a node with
# no password refuses commands from non-loopback clients.
protected-mode yes
port 6379

# --- Durability ---------------------------------------------------------------
# Presence / rate-limit / cache data. AOF gives crash-safe persistence.
appendonly yes

# --- Command hardening (the actual anti-hijack layer) -------------------------
# This node never replicates, loads modules, rewrites its own config, or flushes
# the keyspace as part of normal operation. Disabling these commands makes the
# classic "exposed Redis" attack chain impossible:
#   * REPLICAOF/SLAVEOF -> attacker turns you into a read-only replica of their
#     master  (this is exactly what hit you: "READONLY ... read only replica")
#   * MODULE LOAD       -> remote code execution via a malicious .so
#   * CONFIG SET dir/dbfilename + SAVE -> write SSH keys / cron jobs to disk
#   * DEBUG / FLUSHALL / FLUSHDB -> tampering / data wipe
# An empty target ("") fully disables the command.
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MODULE ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""
