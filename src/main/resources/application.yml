# =============================================================================
# NeoChatHub (TalkMe) — single, unified configuration.
#
# This file merges the former application.yml + application-{local,dev,prod}.yml
# into ONE profile-less config. EVERY environment-specific value is externalized
# to an environment variable with NO inline default — supply them via .env (see
# .env.example1 for the full key list and example values). Values left as plain
# literals below are fixed framework/tuning constants, not per-environment knobs.
#
# .env is autoloaded via spring.config.import below (KEY=VALUE properties).
# =============================================================================

# Behind the reverse proxy (Nginx Proxy Manager) TLS terminates at the proxy and
# requests reach this backend over plain http. Honor X-Forwarded-Proto/Host so
# Spring builds correct absolute URLs (critically the OAuth2 redirect_uri).
# BootUI — DEV-ONLY monitoring console at /bootui. It exposes internal app state, so it
# MUST stay OFF in production: default OFF here, turned ON only via a LOCAL .env
# (BOOTUI_ENABLED=ON). (BootUI is also dormant unless the dev/local profile — or
# spring-boot-devtools — is active; run locally with SPRING_PROFILES_ACTIVE=dev if
# enabling alone doesn't wake it.) NB /bootui/** is permitAll in SecurityConfig, so
# never enable this on a public/prod host.
bootui:
  enabled: ${BOOTUI_ENABLED:OFF}
  # BootUI's built-in filter rejects non-loopback callers (a good default). Reaching it over a
  # remote IP / through a proxy needs this ON — but that exposes app internals (beans, mappings,
  # metrics, env) to anyone who can reach the port. PREFER an SSH tunnel + localhost access; only
  # set BOOTUI_ALLOW_NON_LOCALHOST=true on a firewalled/trusted host. Default false.
  allow-non-localhost: ${BOOTUI_ALLOW_NON_LOCALHOST:false}
  # BootUI MCP server (Streamable HTTP at /bootui/api/mcp) for AI-assistant diagnostics
  # (memory_scan, spring_scan, get_exceptions, ...). Same dev-only caveat as BootUI itself:
  # default OFF, turned ON only via a LOCAL .env (BOOTUI_MCP_ENABLED=ON).
  mcp:
    enabled: ${BOOTUI_MCP_ENABLED:OFF}
server:
  address: 0.0.0.0
  port: ${SERVER_PORT}
  forward-headers-strategy: framework
  servlet:
    session:
      # The API is stateless (JWT); a servlet session only appears transiently during the
      # Google OAuth2 login handshake, so a short explicit lifetime is plenty (BootUI
      # SEC-SESSION-005 — Boot's implicit default is 30m).
      timeout: 15m
      cookie:
        # Lax keeps that top-level OAuth redirect working while blocking cross-site
        # subresource/POST cookie replay (BootUI SEC-SESSION-004).
        same-site: lax
    context-path: /
  # Gzip responses on the wire. The Next.js bundle (~3+ MB of JS/CSS uncompressed)
  # compresses to roughly a quarter of that, so this is a large cold-open win on
  # any real network. Tomcat compresses on-the-fly only when the client sends
  # `Accept-Encoding: gzip` and the response is >= min-response-size; the hashed
  # chunks are then cached by the browser + service worker, so the CPU cost is paid
  # at most once per asset per client. (If a reverse proxy such as Nginx already
  # gzips upstream traffic this is harmless — it just means Tomcat rarely runs.)
  #
  # SECURITY — BREACH: this list is deliberately limited to PUBLIC, STATIC asset
  # types (the JS/CSS/HTML/SVG bundle, identical for every user, containing no
  # secrets). We do NOT compress `application/json`/`application/xml`: the API's
  # JSON bodies carry secrets — the access-token JWT is returned in the /auth/login
  # and /auth/refresh bodies (JwtTokensResponse.accessToken) — and compressing a
  # response that mixes a secret with any attacker-influenced/reflected text is the
  # BREACH oracle. Keeping dynamic JSON uncompressed removes that side channel. The
  # performance win is unaffected (the multi-MB payload is JS, not JSON).
  compression:
    enabled: true
    # Single line, no spaces between entries — a folded/multi-line scalar would
    # fold newlines into spaces and yield " application/javascript" (leading space),
    # which fails to match the Content-Type and would silently skip compression.
    mime-types: text/html,text/css,text/plain,text/javascript,application/javascript,application/manifest+json,image/svg+xml
    min-response-size: 1024

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: NeoChatHub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # ---------------------------------------------------------------------------
  # Thread pools for @Async and @Scheduled (BootUI Spring Advisor SPRING-WIRING-004 / SPRING-PERF-005).
  #
  # execution: the app defines its own Executor bean (broadcastExecutor, AsyncConfig), which makes
  # Boot back off from creating applicationTaskExecutor — so every UNQUALIFIED @Async (email sends,
  # web push) silently fell back to Spring's SimpleAsyncTaskExecutor: one new unbounded thread per
  # call, and BootUI flagged 5 ambiguous TaskExecutor beans. mode=force makes Boot create the
  # bounded applicationTaskExecutor (alias taskExecutor) anyway and register an AsyncConfigurer
  # that routes plain @Async to it. Fan-out stays on @Async("broadcastExecutor").
  #
  # scheduling: the WebSocket broker's messageBrokerTaskScheduler also made Boot back off from
  # its taskScheduler, so @Scheduled jobs ran on the broker pool; SchedulingConfig now defines a
  # named taskScheduler built from these properties (20 @Scheduled methods; several 1s reapers).
  # ---------------------------------------------------------------------------
  task:
    execution:
      mode: force
      thread-name-prefix: async-
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 1000
      shutdown:
        await-termination: true
        await-termination-period: 10s
    scheduling:
      thread-name-prefix: sched-
      pool:
        size: 4
      shutdown:
        await-termination: true
        await-termination-period: 10s


  # Jackson: an ABSENT/null JSON primitive deserializes to its default instead of
  # throwing (the app's optional primitive DTO fields rely on this lenient behavior).
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  # GLOBAL multipart cap — must be the LARGEST allowed media (videos = 30MB). The
  # stricter per-type image cap is enforced in UploadController.
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB

  data:
    web:
      pageable:
        serialization-mode: via-dto
        # Hard cap on ?size= for every Pageable endpoint (Spring default 2000). Prevents a
        # single request from pulling thousands of rows (DoS / bulk scraping).
        max-page-size: 200
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      enabled: ${REDIS_ENABLED}
      # Command timeout — raise for a remote/WAN Redis so reapers don't trip.
      timeout: ${REDIS_TIMEOUT_MS}
      lettuce:
        shutdown-timeout: 200ms

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL}
      # Keep a warm floor of open connections at all times (default 2 if unset) so
      # the pool never drains to zero while idle — the first request after a quiet
      # period gets a ready connection instead of opening one on the hot path.
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      # Ping idle connections every 2 min so the DB/firewall/NAT can't silently drop
      # them during a long idle. Without this (Hikari default = disabled) the first
      # open after the app has been quiet a while hits a dead connection → validation
      # fail → synchronous reconnect → the slow "cold" open. Must be < max-lifetime.
      keepalive-time: 120000

  jpa:
    # Dialect is auto-detected from the Postgres driver — setting it explicitly only
    # triggers Hibernate's HHH90000025 deprecation warning on every boot, so it's omitted.
    # Open Session in View is OFF (BootUI Spring Advisor SPRING-JPA-001): this is a pure JSON API
    # with no view rendering. Every mapper/DTO builder runs inside a @Transactional service, the
    # security principal is re-fetched by services that need its associations, and async/AFTER_COMMIT
    # listeners already re-load entities (audited 2026-09-07). The one LAZY read outside a
    # transaction — User.personality in compatibility scoring — is covered by
    # UserRepository.findBy*WithPersonality fetch-joins at the HTTP call sites. Connections are now
    # released when the service transaction ends instead of being held through response writing.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA}
        # Batch lazy association loads (avoid N+1 when mapping pages to DTOs).
        default_batch_fetch_size: 50
        # Group same-table statements so jdbc.batch_size actually forms batches (BootUI
        # HIB-CONFIG-005). These are the top-level hibernate.order_* keys — they used to sit
        # under jdbc.* where Hibernate silently ignored them.
        order_inserts: true
        order_updates: true
        # Tuning diagnostics (BootUI HIB-CONFIG-006/007) — OFF unless the local .env opts in
        # (HIBERNATE_STATISTICS=true, HIBERNATE_SLOW_QUERY_MS=<ms>); 0 disables slow-query logging.
        # log_slow_query is Hibernate 6.3+'s key (JdbcSettings.LOG_SLOW_QUERY); the legacy
        # session.events.log.LOG_QUERIES_SLOWER_THAN_MS is no longer read by Hibernate 7.
        generate_statistics: ${HIBERNATE_STATISTICS:false}
        log_slow_query: ${HIBERNATE_SLOW_QUERY_MS:0}
        jdbc:
          batch_size: 30
          batch_versioned_data: true
          # Pin JDBC timestamp binding/reading to UTC so java.time conversions never depend on
          # the host JVM zone (BootUI HIB-CONFIG-013). Safe: every entity temporal field is an
          # Instant or LocalDate (no LocalDateTime).
          time_zone: UTC
        query:
          fail_on_pagination_over_collection_fetch: true
          # BootUI HIB-CONFIG-009: pad IN-clause parameter counts to powers of two so
          # variable-length IN (...) predicates reuse a bounded set of execution plans.
          in_clause_parameter_padding: true

  # SMTP — final fallback after the Resend/Brevo HTTP APIs.
  mail:
    host: ${MAIL_SMTP_HOST}
    port: ${MAIL_SMTP_PORT}
    username: ${MAIL_SMTP_USERNAME}
    password: ${MAIL_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}
        connecttimeout: 5000
        timeout: 5000
        writetimeout: 5000

  # RabbitMQ CONNECTION (used only when the broker relay / AMQP events are enabled).
  # The publishing/consume TUNING below is shared across every environment.
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 4
          multiplier: 2.0
          max-interval: 10000ms

  # Google social login (OAuth2 / OIDC). INACTIVE until client id + secret are set.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: ${GOOGLE_OAUTH_SCOPES}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

# OpenAPI / Swagger UI. Endpoint discovery tooling, not application functionality, so it is
# OFF by default in every profile (BootUI pentest PT-A05-041) — the generated schema lists every
# route and its request shape, which makes crafting requests trivial for anyone who reaches the
# port. A developer who wants the UI opts in for their machine only, via the git-ignored .env:
#   SPRINGDOC_ENABLED=true      → http://localhost:8080/swagger-ui.html
# The 'prod' profile below pins both to false regardless, so the opt-in cannot reach production.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# Observability. Endpoints under /actuator; RESTRICT to an internal network in prod.
management:
  endpoints:
    web:
      exposure:
        # Default to the probe endpoints only. Metrics/Prometheus stay OFF unless the
        # environment opts in (prod sets MANAGEMENT_ENDPOINTS=health,info,metrics,prometheus for
        # the scrape target), so a dev box does not publish the runtime metric inventory that
        # aids reconnaissance (BootUI pentest PT-A05-055 / PT-A05-040). The actuator security
        # chain still restricts everything except health to SUPER_ADMIN.
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    rabbit:
      enabled: ${BROKER_AMQP_EVENTS_ENABLED}
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL}
  metrics:
    tags:
      application: talkMe
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT}

# Session base-auth credentials.
auth:
  username: ${AUTH_USERNAME}
  password: ${AUTH_PASSWORD}

# ── Feature kill-switches (Tier-1 global) ────────────────────────────────────
features:
  enabled-by-default: ${FEATURES_ENABLED_BY_DEFAULT}
  allow-non-verified-flirt-mode: ${FEATURE_ALLOW_NON_VERIFIED_FLIRT_MODE}
  # Global email-verification gate. false (default) = ALL users (verified or unverified) can use
  # every feature; true = features that require verification are limited to verified users.
  # (The 18+ age-verification gate is separate and unaffected.)
  require-verified: ${FEATURE_REQUIRE_VERIFIED:false}
  flags:
    live_audio: ${FEATURE_LIVE_AUDIO}
    flirt_lobby: ${FEATURE_FLIRT_LOBBY}
    midnight_events: ${FEATURE_MIDNIGHT_EVENTS}
    ads: ${FEATURE_ADS}

# ── Advertising customization (on/off gate is features.flags.ads above) ──────
ads:
  provider: ${ADS_PROVIDER}
  label: ${ADS_LABEL}
  ad-choices-url: ${ADS_ADCHOICES_URL}
  client-id: ${ADS_CLIENT_ID}
  script-url: ${ADS_SCRIPT_URL}
  popunder-script-url: ${ADS_POPUNDER_URL}
  social-bar-script-url: ${ADS_SOCIALBAR_URL}
  preview: ${ADS_PREVIEW:false}
  frequency-cap-per-session: ${ADS_FREQ_CAP}
  csp-domains: ${ADS_CSP_DOMAINS}
  placements:
    feed:
      enabled: ${ADS_FEED_ENABLED}
      every-n: ${ADS_FEED_EVERY_N}
      max-per-session: ${ADS_FEED_MAX}
      unit-id: ${ADS_FEED_UNIT}
      provider: ${ADS_FEED_PROVIDER}
      script-url: ${ADS_FEED_SCRIPT_URL}
      format: ${ADS_FEED_FORMAT}
      width: ${ADS_FEED_WIDTH}
      height: ${ADS_FEED_HEIGHT}
    explore:
      enabled: ${ADS_EXPLORE_ENABLED}
      every-n: ${ADS_EXPLORE_EVERY_N}
      max-per-session: ${ADS_EXPLORE_MAX}
      unit-id: ${ADS_EXPLORE_UNIT}
      provider: ${ADS_EXPLORE_PROVIDER}
      script-url: ${ADS_EXPLORE_SCRIPT_URL}
      format: ${ADS_EXPLORE_FORMAT}
      width: ${ADS_EXPLORE_WIDTH}
      height: ${ADS_EXPLORE_HEIGHT}
    reels:
      enabled: ${ADS_REELS_ENABLED}
      every-n: ${ADS_REELS_EVERY_N}
      max-per-session: ${ADS_REELS_MAX}
      unit-id: ${ADS_REELS_UNIT}
      provider: ${ADS_REELS_PROVIDER}
      script-url: ${ADS_REELS_SCRIPT_URL}
      format: ${ADS_REELS_FORMAT}
      width: ${ADS_REELS_WIDTH}
      height: ${ADS_REELS_HEIGHT}
    stories:
      enabled: ${ADS_STORIES_ENABLED}
      every-n: ${ADS_STORIES_EVERY_N}
      max-per-session: ${ADS_STORIES_MAX}
      unit-id: ${ADS_STORIES_UNIT}
      provider: ${ADS_STORIES_PROVIDER}
      script-url: ${ADS_STORIES_SCRIPT_URL}
      format: ${ADS_STORIES_FORMAT}
      width: ${ADS_STORIES_WIDTH}
      height: ${ADS_STORIES_HEIGHT}

app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  security:
    # Reverse proxies in front of the app. X-Forwarded-For entries appended by these hops are
    # trusted; the client-supplied leading entries never are (see util.ClientIp). Prod = Nginx
    # Proxy Manager = 1. Set 0 if the app is reached directly, 2 with a CDN in front of NPM.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
    # Honour CF-Connecting-IP ONLY when Cloudflare proxies all traffic (else it is forgeable).
    trust-cloudflare-header: ${TRUST_CLOUDFLARE_HEADER:false}
    # Fail boot (enforce) / warn / off when a PUBLIC deployment (https origins) is missing the
    # 'prod' profile or exposes BootUI beyond localhost. Guards against shipping a dev .env to prod.
    production-hardening: ${PRODUCTION_HARDENING:warn}
  # Instant Translation — Azure primary, MyMemory (keyless) fallback; fails open.
  translation:
    enabled: ${TRANSLATION_ENABLED}
    daily-cap-per-user: ${TRANSLATION_DAILY_CAP}
    azure-key: ${AZURE_TRANSLATOR_KEY}
    azure-region: ${AZURE_TRANSLATOR_REGION}
    azure-url: ${AZURE_TRANSLATOR_URL}
    mymemory-url: ${MYMEMORY_URL}
  # Live A/V (deferred) — OFF until enabled AND LiveKit creds supplied.
  live-audio:
    enabled: ${LIVE_AUDIO_ENABLED}
    ws-url: ${LIVEKIT_WS_URL}
    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}
    token-ttl-seconds: ${LIVEKIT_TOKEN_TTL}
  geo:
    geolocate-local-ip: ${GEOLOCATE_LOCAL_IP}
  consent:
    age18-plus-version: ${CONSENT_AGE_VERSION}
    community-guidelines-version: ${CONSENT_GUIDELINES_VERSION}
    flirt-lobby-version: ${CONSENT_FLIRT_VERSION}
  cookie:
    secure: ${COOKIE_SECURE}
    same-site: ${COOKIE_SAME_SITE}
  # Transactional email chain: Resend (HTTP) → Brevo (HTTP) → SMTP (spring.mail.*).
  mail:
    enabled: ${MAIL_ENABLED}
    from: ${MAIL_FROM}
    timeout-ms: ${MAIL_TIMEOUT_MS}
    require-verification: ${MAIL_REQUIRE_VERIFICATION}
    disposable-domains: ${MAIL_DISPOSABLE_DOMAINS}
    resend:
      api-key: ${RESEND_API_KEY}
      daily-limit: ${RESEND_DAILY_LIMIT}
    brevo:
      api-key: ${BREVO_API_KEY}
      daily-limit: ${BREVO_DAILY_LIMIT}
    smtp:
      enabled: ${MAIL_SMTP_ENABLED}
    brand:
      name: ${MAIL_BRAND_NAME}
      tagline: ${MAIL_BRAND_TAGLINE}
      support-email: ${MAIL_SUPPORT_EMAIL}
    unread-digest:
      enabled: ${UNREAD_DIGEST_ENABLED}
      cron: ${UNREAD_DIGEST_CRON}
      zone: ${UNREAD_DIGEST_ZONE}
      max-previews: ${UNREAD_DIGEST_MAX_PREVIEWS}
  # STOMP broker relay — OFF unless enabled AND RabbitMQ STOMP plugin reachable.
  broker:
    relay-enabled: ${BROKER_RELAY_ENABLED}
    relay-host: ${BROKER_RELAY_HOST}
    relay-port: ${BROKER_RELAY_PORT}
    relay-login: ${BROKER_RELAY_LOGIN}
    relay-passcode: ${BROKER_RELAY_PASSCODE}
    amqp-events-enabled: ${BROKER_AMQP_EVENTS_ENABLED}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-CSRF-Token,Accept,X-Request-Id
    exposed-headers: Set-Cookie,X-Request-Id,Retry-After
    allow-credentials: true
  auth:
    password-reset-token-ttl-minutes: ${PASSWORD_RESET_TTL_MIN}
    account-deletion-window-days: ${ACCOUNT_DELETION_WINDOW_DAYS}
    email-verification-token-ttl-minutes: ${EMAIL_VERIFY_TTL_MIN}
  # Per-conversation message encryption (AES-256-GCM). Stays OFF until master-key set.
  # ⚠️ Losing/rotating master-key makes all encrypted messages unrecoverable — back it up.
  crypto:
    chat-encryption:
      enabled: ${CHAT_ENCRYPTION_ENABLED}
    master-key: ${CRYPTO_MASTER_KEY}
  # SuperAdmin bootstrap — comma-separated emails granted ROLE_SUPER_ADMIN on boot.
  super-admin:
    emails: ${SUPER_ADMIN_EMAILS}

# WebSocket allowed origins (comma-separated; '*' only for local).
websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 2592000000   # 30 days
    guest-refresh-token-expiration-ms: 604800000  # 7 days
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY}
    refill-tokens: ${RATE_LIMIT_REFILL}
    refill-period-seconds: 1
  # Cloudflare Turnstile.
  captcha:
    enabled: ${CAPTCHA_ENABLED}
    secret-key: ${TURNSTILE_SECRET_KEY}

# Web Push (VAPID).
webpush:
  enabled: ${WEBPUSH_ENABLED}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: ${VAPID_SUBJECT}

# Content moderation — word-lists + NSFW sidecar.
moderation:
  enabled: ${MODERATION_ENABLED}
  nsfw:
    enabled: ${NSFW_ENABLED}
    base-url: ${NSFW_BASE_URL}

# Media storage. media-root is the shared root for OCI object keys + local disk.
storage:
  provider: ${STORAGE_PROVIDER}
  media-root: ${FILE_BASE_DIR}
  # PREVIOUS media-roots (comma-separated) still carried by old DB references. Object keys
  # never include the root, so listing an old root here lets old media keep resolving after
  # the root is renamed (e.g. /opt/media/talkMe → /opt/media/neochathub). Default covers the
  # known talkMe→neochathub rename; override with LEGACY_MEDIA_ROOTS.
  legacy-media-roots: ${LEGACY_MEDIA_ROOTS:/opt/media/talkMe}
  local:
    directory: ${FILE_BASE_DIR}
  oci:
    namespace: ${OCI_NAMESPACE}
    region: ${OCI_REGION}
    bucket: ${OCI_BUCKET}
    config-file: ${OCI_CONFIG_FILE}
    config-profile: ${OCI_CONFIG_PROFILE}

logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    com.neo.chat: ${LOG_LEVEL_APP}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY}
    org.hibernate: ${LOG_LEVEL_HIBERNATE}
    # ── Noise suppression (cosmetic, environment-agnostic) ─────────────────────
    # Lettuce logs "Cannot apply TCP User Timeout options to channel type
    # NioSocketChannel" on every Redis (re)connect when the native epoll/kqueue
    # transport isn't on the classpath — harmless, so drop it to ERROR.
    io.lettuce.core.ConnectionBuilder: error
    # ddl-auto=update emits "constraint ... does not exist, skipping" (HHH000247)
    # on every boot as it reconciles the schema — expected, not actionable.
    org.hibernate.orm.jdbc.warn: error
    # HHH90000025 dialect-deprecation chatter (also addressed by dropping the
    # explicit spring.jpa.database-platform above).
    org.hibernate.orm.deprecation: error
  # ── File logging + daily/size rolling ──────────────────────────────────────
  # Writes to ${LOGGING_FILE_NAME}; rolls daily and at max-file-size, keeping
  # max-history days up to total-size-cap. Path/name are env-driven (no defaults).
  file:
    path: ${LOGGING_FILE_PATH}
    name: ${LOGGING_FILE_NAME}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOGGING_FILE_PATH}/neochathub-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      total-size-cap: 1GB
      max-history: 90
      clean-history-on-start: false

  pattern:
    level: "%5p [requestId=%X{requestId}]"

---
# ── Production overrides ─────────────────────────────────────────────────────
# The OpenAPI document + Swagger UI enumerate every endpoint (including the admin API). They
# were only auth-gated in prod, i.e. readable by any signed-in user. Turn them off entirely.
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
