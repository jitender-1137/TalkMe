# =============================================================================
# NeoChatHub (TalkMe) — single, unified configuration.
#
# This file merges the former application.yml + application-{local,dev,prod}.yml
# into ONE profile-less config. EVERY environment-specific value is externalized
# to an environment variable with NO inline default — supply them via .env (see
# .env.example1 for the full key list and example values). Values left as plain
# literals below are fixed framework/tuning constants, not per-environment knobs.
#
# .env is autoloaded via spring.config.import below (KEY=VALUE properties).
# =============================================================================

# Behind the reverse proxy (Nginx Proxy Manager) TLS terminates at the proxy and
# requests reach this backend over plain http. Honor X-Forwarded-Proto/Host so
# Spring builds correct absolute URLs (critically the OAuth2 redirect_uri).
server:
  address: 0.0.0.0
  port: ${SERVER_PORT}
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: NeoChatHub

  # Jackson: an ABSENT/null JSON primitive deserializes to its default instead of
  # throwing (the app's optional primitive DTO fields rely on this lenient behavior).
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  # GLOBAL multipart cap — must be the LARGEST allowed media (videos = 30MB). The
  # stricter per-type image cap is enforced in UploadController.
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB

  data:
    web:
      pageable:
        serialization-mode: via-dto
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      enabled: ${REDIS_ENABLED}
      # Command timeout — raise for a remote/WAN Redis so reapers don't trip.
      timeout: ${REDIS_TIMEOUT_MS}
      lettuce:
        shutdown-timeout: 200ms

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL}
      minimum-idle: ${DB_MIN_IDLE}
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA}
        # Batch lazy association loads (avoid N+1 when mapping pages to DTOs).
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 30
          order_inserts: true
          order_updates: true
          batch_versioned_data: true
        query:
          fail_on_pagination_over_collection_fetch: true

  # SMTP — final fallback after the Resend/Brevo HTTP APIs.
  mail:
    host: ${MAIL_SMTP_HOST}
    port: ${MAIL_SMTP_PORT}
    username: ${MAIL_SMTP_USERNAME}
    password: ${MAIL_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}
        connecttimeout: 5000
        timeout: 5000
        writetimeout: 5000

  # RabbitMQ CONNECTION (used only when the broker relay / AMQP events are enabled).
  # The publishing/consume TUNING below is shared across every environment.
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 4
          multiplier: 2.0
          max-interval: 10000ms

  # Google social login (OAuth2 / OIDC). INACTIVE until client id + secret are set.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: ${GOOGLE_OAUTH_SCOPES}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

# Observability. Endpoints under /actuator; RESTRICT to an internal network in prod.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    rabbit:
      enabled: ${BROKER_AMQP_EVENTS_ENABLED}
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL}
  metrics:
    tags:
      application: talkMe
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT}

# Session base-auth credentials.
auth:
  username: ${AUTH_USERNAME}
  password: ${AUTH_PASSWORD}

# ── Feature kill-switches (Tier-1 global) ────────────────────────────────────
features:
  enabled-by-default: ${FEATURES_ENABLED_BY_DEFAULT}
  allow-non-verified-flirt-mode: ${FEATURE_ALLOW_NON_VERIFIED_FLIRT_MODE}
  # Global email-verification gate. false (default) = ALL users (verified or unverified) can use
  # every feature; true = features that require verification are limited to verified users.
  # (The 18+ age-verification gate is separate and unaffected.)
  require-verified: ${FEATURE_REQUIRE_VERIFIED:false}
  flags:
    live_audio: ${FEATURE_LIVE_AUDIO}
    flirt_lobby: ${FEATURE_FLIRT_LOBBY}
    midnight_events: ${FEATURE_MIDNIGHT_EVENTS}
    ads: ${FEATURE_ADS}

# ── Advertising customization (on/off gate is features.flags.ads above) ──────
ads:
  provider: ${ADS_PROVIDER}
  label: ${ADS_LABEL}
  ad-choices-url: ${ADS_ADCHOICES_URL}
  client-id: ${ADS_CLIENT_ID}
  script-url: ${ADS_SCRIPT_URL}
  popunder-script-url: ${ADS_POPUNDER_URL}
  social-bar-script-url: ${ADS_SOCIALBAR_URL}
  frequency-cap-per-session: ${ADS_FREQ_CAP}
  csp-domains: ${ADS_CSP_DOMAINS}
  placements:
    feed:
      enabled: ${ADS_FEED_ENABLED}
      every-n: ${ADS_FEED_EVERY_N}
      max-per-session: ${ADS_FEED_MAX}
      unit-id: ${ADS_FEED_UNIT}
      provider: ${ADS_FEED_PROVIDER}
      script-url: ${ADS_FEED_SCRIPT_URL}
      format: ${ADS_FEED_FORMAT}
      width: ${ADS_FEED_WIDTH}
      height: ${ADS_FEED_HEIGHT}
    explore:
      enabled: ${ADS_EXPLORE_ENABLED}
      every-n: ${ADS_EXPLORE_EVERY_N}
      max-per-session: ${ADS_EXPLORE_MAX}
      unit-id: ${ADS_EXPLORE_UNIT}
      provider: ${ADS_EXPLORE_PROVIDER}
      script-url: ${ADS_EXPLORE_SCRIPT_URL}
      format: ${ADS_EXPLORE_FORMAT}
      width: ${ADS_EXPLORE_WIDTH}
      height: ${ADS_EXPLORE_HEIGHT}
    reels:
      enabled: ${ADS_REELS_ENABLED}
      every-n: ${ADS_REELS_EVERY_N}
      max-per-session: ${ADS_REELS_MAX}
      unit-id: ${ADS_REELS_UNIT}
      provider: ${ADS_REELS_PROVIDER}
      script-url: ${ADS_REELS_SCRIPT_URL}
      format: ${ADS_REELS_FORMAT}
      width: ${ADS_REELS_WIDTH}
      height: ${ADS_REELS_HEIGHT}
    stories:
      enabled: ${ADS_STORIES_ENABLED}
      every-n: ${ADS_STORIES_EVERY_N}
      max-per-session: ${ADS_STORIES_MAX}
      unit-id: ${ADS_STORIES_UNIT}
      provider: ${ADS_STORIES_PROVIDER}
      script-url: ${ADS_STORIES_SCRIPT_URL}
      format: ${ADS_STORIES_FORMAT}
      width: ${ADS_STORIES_WIDTH}
      height: ${ADS_STORIES_HEIGHT}

app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  # Instant Translation — Azure primary, MyMemory (keyless) fallback; fails open.
  translation:
    enabled: ${TRANSLATION_ENABLED}
    daily-cap-per-user: ${TRANSLATION_DAILY_CAP}
    azure-key: ${AZURE_TRANSLATOR_KEY}
    azure-region: ${AZURE_TRANSLATOR_REGION}
    azure-url: ${AZURE_TRANSLATOR_URL}
    mymemory-url: ${MYMEMORY_URL}
  # Live A/V (deferred) — OFF until enabled AND LiveKit creds supplied.
  live-audio:
    enabled: ${LIVE_AUDIO_ENABLED}
    ws-url: ${LIVEKIT_WS_URL}
    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}
    token-ttl-seconds: ${LIVEKIT_TOKEN_TTL}
  geo:
    geolocate-local-ip: ${GEOLOCATE_LOCAL_IP}
  consent:
    age18-plus-version: ${CONSENT_AGE_VERSION}
    community-guidelines-version: ${CONSENT_GUIDELINES_VERSION}
    flirt-lobby-version: ${CONSENT_FLIRT_VERSION}
  cookie:
    secure: ${COOKIE_SECURE}
    same-site: ${COOKIE_SAME_SITE}
  # Transactional email chain: Resend (HTTP) → Brevo (HTTP) → SMTP (spring.mail.*).
  mail:
    enabled: ${MAIL_ENABLED}
    from: ${MAIL_FROM}
    timeout-ms: ${MAIL_TIMEOUT_MS}
    require-verification: ${MAIL_REQUIRE_VERIFICATION}
    disposable-domains: ${MAIL_DISPOSABLE_DOMAINS}
    resend:
      api-key: ${RESEND_API_KEY}
      daily-limit: ${RESEND_DAILY_LIMIT}
    brevo:
      api-key: ${BREVO_API_KEY}
      daily-limit: ${BREVO_DAILY_LIMIT}
    smtp:
      enabled: ${MAIL_SMTP_ENABLED}
    brand:
      name: ${MAIL_BRAND_NAME}
      tagline: ${MAIL_BRAND_TAGLINE}
      support-email: ${MAIL_SUPPORT_EMAIL}
    unread-digest:
      enabled: ${UNREAD_DIGEST_ENABLED}
      cron: ${UNREAD_DIGEST_CRON}
      zone: ${UNREAD_DIGEST_ZONE}
      max-previews: ${UNREAD_DIGEST_MAX_PREVIEWS}
  # STOMP broker relay — OFF unless enabled AND RabbitMQ STOMP plugin reachable.
  broker:
    relay-enabled: ${BROKER_RELAY_ENABLED}
    relay-host: ${BROKER_RELAY_HOST}
    relay-port: ${BROKER_RELAY_PORT}
    relay-login: ${BROKER_RELAY_LOGIN}
    relay-passcode: ${BROKER_RELAY_PASSCODE}
    amqp-events-enabled: ${BROKER_AMQP_EVENTS_ENABLED}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-CSRF-Token,Accept,X-Request-Id
    exposed-headers: Set-Cookie,X-Request-Id
    allow-credentials: true
  auth:
    password-reset-token-ttl-minutes: ${PASSWORD_RESET_TTL_MIN}
    account-deletion-window-days: ${ACCOUNT_DELETION_WINDOW_DAYS}
    email-verification-token-ttl-minutes: ${EMAIL_VERIFY_TTL_MIN}
  # Per-conversation message encryption (AES-256-GCM). Stays OFF until master-key set.
  # ⚠️ Losing/rotating master-key makes all encrypted messages unrecoverable — back it up.
  crypto:
    chat-encryption:
      enabled: ${CHAT_ENCRYPTION_ENABLED}
    master-key: ${CRYPTO_MASTER_KEY}
  # SuperAdmin bootstrap — comma-separated emails granted ROLE_SUPER_ADMIN on boot.
  super-admin:
    emails: ${SUPER_ADMIN_EMAILS}

# WebSocket allowed origins (comma-separated; '*' only for local).
websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 2592000000   # 30 days
    guest-refresh-token-expiration-ms: 604800000  # 7 days
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY}
    refill-tokens: ${RATE_LIMIT_REFILL}
    refill-period-seconds: 1
  # Cloudflare Turnstile.
  captcha:
    enabled: ${CAPTCHA_ENABLED}
    secret-key: ${TURNSTILE_SECRET_KEY}

# Web Push (VAPID).
webpush:
  enabled: ${WEBPUSH_ENABLED}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: ${VAPID_SUBJECT}

# Content moderation — word-lists + NSFW sidecar.
moderation:
  enabled: ${MODERATION_ENABLED}
  nsfw:
    enabled: ${NSFW_ENABLED}
    base-url: ${NSFW_BASE_URL}

# Media storage. media-root is the shared root for OCI object keys + local disk.
storage:
  provider: ${STORAGE_PROVIDER}
  media-root: ${FILE_BASE_DIR}
  local:
    directory: ${FILE_BASE_DIR}
  oci:
    namespace: ${OCI_NAMESPACE}
    region: ${OCI_REGION}
    bucket: ${OCI_BUCKET}
    config-file: ${OCI_CONFIG_FILE}
    config-profile: ${OCI_CONFIG_PROFILE}

logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    com.neo.chat: ${LOG_LEVEL_APP}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY}
    org.hibernate: ${LOG_LEVEL_HIBERNATE}
  # ── File logging + daily/size rolling ──────────────────────────────────────
  # Writes to ${LOGGING_FILE_NAME}; rolls daily and at max-file-size, keeping
  # max-history days up to total-size-cap. Path/name are env-driven (no defaults).
  file:
    path: ${LOGGING_FILE_PATH}
    name: ${LOGGING_FILE_NAME}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOGGING_FILE_PATH}/neochathub-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      total-size-cap: 1GB
      max-history: 90
      clean-history-on-start: false

  pattern:
    level: "%5p [requestId=%X{requestId}]"
