server:
  port: ${SERVER_PORT:8443} # Updated default to 8443 for SSL
  servlet:
    context-path: /

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  #### REDIS CONFIGURATION ####
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      enabled: ${REDIS_ENABLED:true}

app:
  cors:
    # Locked to known origins (comma-separated). Override via env for extra domains.
    allowed-origins: ${ALLOWED_ORIGINS:https://chat.parkarspot.com}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-CSRF-Token,Accept
    exposed-headers: Set-Cookie
    allow-credentials: true
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

# WebSocket Configuration
websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:https://chat.parkarspot.com}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 2592000000 # 30 days
    guest-refresh-token-expiration-ms: 604800000 # 7 days
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_REFILL:10}
    refill-period-seconds: 1

storage:
  local:
    directory: ${FILE_BASE_DIR:/opt/media/talkme}

logging:
  level:
    root: WARN
    com.chat.talkMe: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
