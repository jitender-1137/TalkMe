# =============================================================================
# NeoChatHub (TalkMe) — primary configuration (orchestrator).
#
# The former single unified config is now split by DOMAIN into config/*.yml,
# imported below. EVERY environment-specific value is externalized to an
# environment variable with NO inline default — supply them via .env (see
# .env.example1 for the full key list). Values left as plain literals in the
# config/*.yml files are fixed framework/tuning constants, not per-env knobs.
#
# .env is autoloaded via spring.config.import below (KEY=VALUE properties).
#
# NOTE: the config/*.yml files are NOT autoloaded — only files named
# application.yml / application-<profile>.yml are. They load solely via the
# explicit imports below, so keep every domain file listed here.
# =============================================================================
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - classpath:config/server.yml
      - classpath:config/persistence.yml
      - classpath:config/runtime.yml
      - classpath:config/mail.yml
      - classpath:config/messaging.yml
      - classpath:config/oauth.yml
      - classpath:config/observability.yml
      - classpath:config/security.yml
      - classpath:config/features.yml
      - classpath:config/app.yml
      - classpath:config/media.yml
      - classpath:config/logging.yml

  application:
    name: NeoChatHub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  # ── Production overrides ─────────────────────────────────────────────────────
  # The OpenAPI document + Swagger UI enumerate every endpoint (including the admin API). They
  # were only auth-gated in prod, i.e. readable by any signed-in user. Turn them off entirely.
  activate:
    on-profile: prod

# OpenAPI / Swagger UI. Endpoint discovery tooling, not application functionality, so it is
# OFF by default in every profile (BootUI pentest PT-A05-041) — the generated schema lists every
# route and its request shape, which makes crafting requests trivial for anyone who reaches the
# port. A developer who wants the UI opts in for their machine only, via the git-ignored .env:
#   SPRINGDOC_ENABLED=true      → http://localhost:8080/swagger-ui.html
# The 'prod' profile below pins both to false regardless, so the opt-in cannot reach production.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
