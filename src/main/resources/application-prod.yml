server:
  port: ${SERVER_PORT:8443} # Updated default to 8443 for SSL
  servlet:
    context-path: /api/v1
  ssl:
    enabled: ${SSL_ENABLED:true} # Set to true to utilize your server-keystore
    key-store: "file:/home/ubuntu/TalkMe/jar/server-keystore.p12"
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: redis-server

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        bundle: redis-ssl-bundle

  # FIXED: Moved completely out of data.redis and aligned perfectly under spring:
  # FIXED: Changed configuration key from 'pem' to 'jks' to properly digest binary .p12 structures
  ssl:
    bundle:
      jks:
        redis-ssl-bundle:
          keystore:
            location: "file:/home/ubuntu/TalkMe/jar/server-keystore.p12"
            password: ${SSL_KEY_STORE_PASSWORD}
            type: "PKCS12"
