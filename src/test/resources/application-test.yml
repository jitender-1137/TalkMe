spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

# CORS configurations
app:
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-CSRF-Token,Accept
    exposed-headers: Set-Cookie
    allow-credentials: true

# Security JWT details
security:
  jwt:
    secret-key: c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5c2VjdXJla2V5
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 2592000000
    guest-refresh-token-expiration-ms: 604800000
  rate-limit:
    capacity: 100
    refill-tokens: 10
    refill-period-seconds: 1
  # CAPTCHA (Cloudflare Turnstile) defaults to enabled=true in CaptchaProperties. Disable it in
  # tests so signup/login flows don't require a Turnstile token (the human-gate is exercised
  # directly in AuthControllerUnitTest via a mocked CaptchaService).
  captcha:
    enabled: false

# Media storage — LocalMediaStorage binds `storage.media-root` (the legacy
# storage.local.directory / storage.s3.* keys are no longer read). Point it at a
# writable, build-local dir so the context boots in tests (the default /media is not
# writable in CI / on dev machines and previously failed context load).
storage:
  provider: local
  media-root: ./build/test-media
  # WebMvcConfig still binds @Value("${storage.local.directory}") to serve /talkMe/** —
  # keep it defined (writable, build-local) so the context resolves the placeholder.
  local:
    directory: ./build/test-uploads

# WebSocket Configuration
websocket:
  allowed-origins: http://localhost:3000
